<script>
/* the tiny beaver really gnaws: every bite takes a little more of the logo, drops a crumb, and it steps up to the new edge */
(function(){
  var CX = 162, CY = 14, R0 = 22, R1 = 44, STEP = .45, NS = "http://www.w3.org/2000/svg";
  var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var teeth = [], a = 172;
  while (a <= 278){ var w = 7 + rnd() * 4; teeth.push({a: a, w: w, j: rnd() * 7 - 3.5, d: 2.5 + rnd() * 2.5}); a += w; }
  function pt(ang, r){ return [CX + r * Math.cos(ang * Math.PI / 180), CY - r * Math.sin(ang * Math.PI / 180)]; }
  function shape(R){
    var pts = [];
    teeth.forEach(function(t){ var r = R + t.j * R / 36;
      pts.push(pt(t.a, r), pt(t.a + t.w * .15, r + t.d), pt(t.a + t.w * .85, r + t.d), pt(t.a + t.w, r)); });
    return pts;
  }
  var bp = document.getElementById("bp"), r1 = document.getElementById("r1"), r2 = document.getElementById("r2"),
      gr = document.getElementById("gr"), tiny = document.getElementById("tiny"), crumbs = document.getElementById("crumbs"),
      pile = crumbs.querySelectorAll(".pile");
  function draw(R){
    var pts = shape(R), d = "M170 0 L" + pts.map(function(p){ return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L") + " L170 170 L190 170 L190 -20 L170 -20 Z";
    bp.setAttribute("d", d); r1.setAttribute("d", d); r2.setAttribute("d", d);
    var g = "";
    for (var i = 0; i < pts.length - 1; i += 4){ var p = pts[i + 1], an = Math.atan2(p[1] - CY, p[0] - CX), L = 4 + (i % 7) * .6;
      g += '<path d="M' + p[0].toFixed(1) + " " + p[1].toFixed(1) + " l" + (L * Math.cos(an)).toFixed(1) + " " + (L * Math.sin(an)).toFixed(1) + '"/>'; }
    gr.innerHTML = g;
    tiny.setAttribute("transform", "translate(" + (CX - .139 * R - 4).toFixed(1) + " " + (CY + .99 * R + 2).toFixed(1) + ") scale(.3)");
  }
  if (!document.documentElement.classList.contains("js")){ draw(36); return; }   /* animations off: one still bite */
  var R = R0, n = 0;
  draw(R);
  function crumb(){
    var m = pt(232, R), gEl = document.createElementNS(NS, "g"), c = document.createElementNS(NS, "polygon"), s = 2.6 + rnd() * 2.6, k = 5 + Math.floor(rnd() * 3), q = [];
    for (var i = 0; i < k; i++){ var an = 2 * Math.PI * i / k + rnd() * .6 - .3, rr = s * (.6 + rnd() * .4); q.push((rr * Math.cos(an)).toFixed(1) + "," + (rr * Math.sin(an) * .8).toFixed(1)); }
    c.setAttribute("class", "cr"); c.setAttribute("points", q.join(" ")); c.setAttribute("transform", "translate(" + m[0].toFixed(1) + " " + m[1].toFixed(1) + ")");
    gEl.setAttribute("class", "fall"); gEl.style.setProperty("--dx", (14 + rnd() * 26).toFixed(0) + "px"); gEl.style.setProperty("--dy", (166 - m[1]).toFixed(0) + "px");
    gEl.appendChild(c); crumbs.appendChild(gEl);
    gEl.addEventListener("animationend", function(){ gEl.remove(); });
  }
  var timer = setInterval(function(){
    if (document.hidden) return;
    tiny.classList.add("down");
    setTimeout(function(){
      tiny.classList.remove("down");
      R = Math.min(R1, R + STEP); n++; draw(R); crumb();
      if (n % 7 === 1 && pile[(n - 1) / 7]) pile[(n - 1) / 7].classList.add("on");
      if (R >= R1){ clearInterval(timer); tiny.classList.add("full"); }
    }, 140);
  }, 560);
})();
</script>
