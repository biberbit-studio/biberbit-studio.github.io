<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · BiberBit Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" id="theme-color" content="#F2EFE8">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-48.png" type="image/png" sizes="48x48">
<script>
(function(){
  var r = document.documentElement, t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "light" && t !== "dark" && t !== "biber") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  r.setAttribute("data-theme", t);
  document.getElementById("theme-color").setAttribute("content", {light: "#F2EFE8", dark: "#15181D", biber: "#0F2A2E"}[t]);
})();
</script>
<style>
@font-face{font-family:"Biber Display";src:url(/fonts/BiberDisplay-Bold.woff2) format("woff2"),url(/fonts/BiberDisplay-Bold.woff) format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(/fonts/SpaceGrotesk.woff) format("woff");font-weight:300 700;font-display:swap}
:root{--bg:#F2EFE8;--ink:#15181D;--muted:#5B616B;--honey:#F0A33C;--line:rgba(21,24,29,.13);--rings:url(/img/rings-a-light.webp)}
:root[data-theme="dark"]{--bg:#15181D;--ink:#F2EFE8;--muted:#A9AFB8;--line:rgba(242,239,232,.13);--rings:url(/img/rings-a-dark.webp);color-scheme:dark}
:root[data-theme="biber"]{--bg:#0F2A2E;--ink:#F6EAD3;--muted:#B8C7C0;--honey:#F5B14E;--line:rgba(246,234,211,.15);--rings:url(/img/rings-a-biber.webp);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--bg) var(--rings) center/cover no-repeat;color:var(--ink);font:400 1.05rem/1.55 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
main{max-width:520px}
.log{position:relative;width:170px;height:170px;margin:0 auto 26px}
.log img{width:100%;height:100%;border-radius:38px}
.bite{position:absolute;right:-14px;top:22px;width:58px;height:58px;border-radius:50%;background:var(--bg)}
.bite:nth-child(3){right:6px;top:-16px;width:46px;height:46px}
.code{margin:0 0 6px;font-family:"Biber Display","Space Grotesk",sans-serif;font-size:1rem;letter-spacing:.3em;color:var(--honey)}
h1{margin:0 0 12px;font-family:"Biber Display","Space Grotesk",sans-serif;font-weight:700;font-size:clamp(2rem,7vw,2.9rem);line-height:1.05}
p{margin:0 0 26px;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:transform .2s}
a.btn:hover{transform:translateY(-2px)}
a.btn:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="log" aria-hidden="true"><img src="/img/beaver-420.webp" width="420" height="420" alt=""><i class="bite"></i><i class="bite"></i></div>
  <p class="code">404</p>
  <h1>This page got gnawed away.</h1>
  <p>A beaver got here first. The games are all still in one piece, though.</p>
  <a class="btn" href="/">Back to BiberBit</a>
</main>
</body>
</html>
